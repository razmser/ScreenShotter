name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary-key.p8"

      - name: Build app bundle
        run: ./scripts/build-app.sh
        env:
          SIGN_IDENTITY: Developer ID Application
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Notarize
        run: ./scripts/notarize.sh
        env:
          NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}

      - name: Package
        run: |
          ditto -c -k --keepParent build/ScreenShotter.app "build/ScreenShotter-${{ steps.version.outputs.version }}.zip"
          cd build && shasum -a 256 "ScreenShotter-${{ steps.version.outputs.version }}.zip" > "ScreenShotter-${{ steps.version.outputs.version }}.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ScreenShotter-${{ steps.version.outputs.version }}
          path: build/ScreenShotter-${{ steps.version.outputs.version }}.zip*

      - name: Release notes
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > build/release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/ScreenShotter-${{ steps.version.outputs.version }}.zip \
            build/ScreenShotter-${{ steps.version.outputs.version }}.zip.sha256 \
            --title "ScreenShotter ${{ steps.version.outputs.version }}" \
            --notes-file build/release-notes.md

      - name: Bump Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256="$(cut -d ' ' -f 1 "build/ScreenShotter-$VERSION.zip.sha256")"
          gh repo clone razmser/homebrew-tap build/homebrew-tap -- --depth 1
          cd build/homebrew-tap
          sed -i '' -E \
            -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$sha256\"/" \
            Casks/screenshotter.rb
          git diff --exit-code --quiet && { echo "Cask already at $VERSION"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "screenshotter $VERSION"
          gh auth setup-git
          git push
