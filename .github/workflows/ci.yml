name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

  app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build app bundle
        run: ./scripts/build-app.sh
        env:
          SIGN_IDENTITY: "-"

      - name: Package
        run: ditto -c -k --keepParent build/ScreenShotter.app build/ScreenShotter.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ScreenShotter
          path: build/ScreenShotter.zip
          retention-days: 14
